name: Generate profile assets

# Regenerates the statistics cards and the contribution snake used in README.md.
# Everything is read from the GitHub API with the default GITHUB_TOKEN and
# published to the `output` branch, so the README never shows stale or
# fabricated numbers and does not depend on third-party widget hosting.

on:
  schedule:
    - cron: "17 2 * * *"        # daily at 02:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/profile-assets.yml"

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate statistics cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: Blueskale
          OUT_DIR: dist
        run: python scripts/generate_stats.py

      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: Blueskale
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            dist/github-contribution-grid-snake-tokyo.svg?color_snake=#7aa2f7&color_dots=#1a1b27,#2d3f6e,#3d59a1,#5f85d6,#7aa2f7

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore: refresh profile assets"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
